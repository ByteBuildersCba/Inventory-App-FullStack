<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">

      <a class="logo" routerLink="/home">
        ToolShare CBA
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuNavegacion"
        aria-controls="menuNavegacion"
        aria-expanded="false"
        aria-label="Activar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="collapse navbar-collapse"
        id="menuNavegacion"
      >

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          @if (esAdmin) {

            <!-- NAVEGACIÓN ADMIN -->
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/quienes-somos"
              >
                Quiénes Somos
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/admin/solicitudes"
              >
                Gestionar Préstamos
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/admin/inventario"
              >
                Inventario
              </a>
            </li>

          } @else {

            <!-- NAVEGACIÓN USUARIO -->
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/home"
              >
                Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/quienes-somos"
              >
                Quiénes Somos
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/herramientas"
              >
                Herramientas
              </a>
            </li>

          }

        </ul>

        <!-- BOTÓN PARA CAMBIAR DE MODO -->
        <div class="d-flex align-items-center gap-2">

          @if (esAdmin) {

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="cambiarModo()"
            >
              Modo Usuario
            </button>

          } @else {

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="cambiarModo()"
            >
              Modo Admin
            </button>

          }

          <a
            routerLink="/login"
            class="btn btn-primary"
          >
            Iniciar Sesión
          </a>

        </div>

      </div>
    </div>
  </nav>
</header>
