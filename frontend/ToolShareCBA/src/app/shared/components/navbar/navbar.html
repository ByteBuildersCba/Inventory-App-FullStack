<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">

      <a class="logo navbar-brand fw-bold text-success" routerLink="/home">
        ToolShare CBA
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuNavegacion"
        aria-controls="menuNavegacion"
        aria-expanded="false"
        aria-label="Activar navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavegacion">

        <!-- NAVEGACIÓN PÚBLICA / GENERAL -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/quienes-somos">Quiénes Somos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/herramientas">Herramientas</a>
          </li>
        </ul>

        <!-- ACCIONES DE SESIÓN (DERECHA) -->
        <div class="d-flex align-items-center gap-2">

          @if (estaLogueado) {

            <!-- Un solo botón para acceder al panel personal -->
            <a routerLink="/usuario/dashboard" class="btn btn-outline-success">
              👤 Mi Panel
            </a>

            <button
              type="button"
              class="btn btn-outline-danger"
              (click)="cerrarSesion()"
            >
              Cerrar Sesión
            </button>

          } @else {

            <a routerLink="/login" class="btn btn-success">
              Iniciar Sesión
            </a>

          }

        </div>

      </div>
    </div>
  </nav>
</header>
