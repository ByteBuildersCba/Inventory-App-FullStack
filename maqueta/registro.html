<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ToolShare CBA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="logo fw-bold text-success fs-4 text-decoration-none" href="index.html">ToolShare CBA</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Activar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="QuienesSomos.html">Quiénes Somos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Herramientas.html">Herramientas</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex">
                        <a href="login.html" class="btn btn-custom-green text-white fw-bold">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card shadow border-0 p-4">
                        <div class="card-body">
                            <h1 class="h3 card-title text-center mb-2 fw-bold text-dark">Crear Cuenta</h1>
                            <p class="text-muted text-center small mb-4">Unite a la comunidad para prestar o solicitar herramientas en Córdoba.</p>

                            <form action="#" method="POST" novalidate>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre completo:</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Tu nombre y apellido">
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Correo Electrónico:</label>
                                    <input type="email" id="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Contraseña:</label>
                                    <input type="password" id="password" name="password" class="form-control" required placeholder="Crea una contraseña segura">
                                </div>

                                <div class="mb-4">
                                    <label for="rol" class="form-label fw-semibold">Tipo de usuario:</label>
                                    <select id="rol" name="rol" class="form-select">
                                        <option value="user">Usuario (Vecino/Emprendedor)</option>
                                        <option value="admin">Administrador (Gestión)</option>
                                    </select>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-custom-green text-white fw-bold py-2">Registrarse</button>
                                </div>
                            </form>

                            <div class="text-center mt-4 small">
                                <p class="mb-0">¿Ya tenés una cuenta? <a href="login.html" class="text-success fw-bold text-decoration-none">Iniciá sesión acá</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-1">&copy; 2026 ToolShare CBA. | <strong>Proyecto ISPC</strong></p>
            <p class="mb-0 text-muted small">Equipo: ByteBuildersCBA - Desarrollo Frontend</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
