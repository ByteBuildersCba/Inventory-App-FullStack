<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión de Herramientas Córdoba</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   <header> 
        <div class="container nav-container">
            <div class="logo"> ToolShare CBA</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="QuienesSomos.html">Quíenes Somos</a></li>
                    <li><a href="Herramientas.html">Herramientas</a></li>
                </ul>
            </nav>
            <a href="login.html">Iniciar Sesión</a>
        </div>
    </header>

  <main>
    
    <section class="section-white"> 
        <div class="container"> <!-- Mantiene el formulario alineado con el header -->
            
           
            <h1 class="section-title">Iniciar Sesión</h1>
            <p class="section-description">Accedé a tu cuenta para gestionar préstamos de herramientas.</p>

            <form action="#" method="POST" class="login-container">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                </div>

                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </div>
            </form>

            <div class="login-footer text-center mt-2">
                <p>¿No tenés una cuenta? <a href="registro.html" style="color: var(--primary); font-weight: 600;">Registrate aquí</a></p>
            </div>
            
        </div>
    </section>
</main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ToolShare CBA. | <strong>Proyecto ISPC 2026</strong></p>
            <p>Equipo: ByteBuildersCBA - Desarrollo Frontend</p>
        </div>
    </footer>
</body>
</html>
